<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/playground/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Interactive gpt_markdown Flutter playground.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gpt_markdown Playground</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #0f1117;
    }

    #flutter-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(99, 102, 241, 0.14), transparent 30%),
        #0f1117;
      color: #f8fafc;
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    #flutter-loader.ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
    }

    .loader-mark {
      position: relative;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(129, 140, 248, 0.22);
      border-top-color: #818cf8;
      border-radius: 999px;
      animation: loader-spin 1s linear infinite;
    }

    .loader-logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(129, 140, 248, 0.32);
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.14);
      color: #c7d2fe;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 14px 36px rgba(49, 46, 129, 0.24);
    }

    .loader-title {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .loader-copy {
      margin: -10px 0 0;
      color: #94a3b8;
      font-size: 12px;
    }

    .loader-bar {
      width: 180px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
    }

    .loader-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #818cf8, transparent);
      animation: loader-progress 1.2s ease-in-out infinite;
    }

    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes loader-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(245%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring,
      .loader-bar::after {
        animation: none;
      }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "672834543";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="flutter-loader" role="status" aria-live="polite">
    <div class="loader-content">
      <div class="loader-mark" aria-hidden="true">
        <div class="loader-ring"></div>
        <div class="loader-logo">M</div>
      </div>
      <p class="loader-title">Starting the Flutter playground</p>
      <p class="loader-copy">Preparing the real gpt_markdown widget…</p>
      <div class="loader-bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    var playgroundSettled = false;
    var playgroundStartupTimer = window.setTimeout(markPlaygroundError, 15000);

    function markPlaygroundReady() {
      if (playgroundSettled) return;
      playgroundSettled = true;
      window.clearTimeout(playgroundStartupTimer);
      var loader = document.getElementById('flutter-loader');
      if (loader) {
        loader.classList.add('ready');
        loader.setAttribute('aria-hidden', 'true');
      }
      if (window.parent !== window) {
        window.parent.postMessage(
          { type: 'gpt-markdown-playground-ready' },
          window.location.origin
        );
      }
    }

    function markPlaygroundError() {
      if (playgroundSettled) return;
      playgroundSettled = true;
      window.clearTimeout(playgroundStartupTimer);
      var copy = document.querySelector('.loader-copy');
      if (copy) copy.textContent = 'The playground could not start. Please reload and try again.';
      if (window.parent !== window) {
        window.parent.postMessage(
          { type: 'gpt-markdown-playground-error' },
          window.location.origin
        );
      }
    }

    window.addEventListener('flutter-first-frame', markPlaygroundReady, { once: true });
    window.addEventListener('load', function(ev) {
      try {
        if (!window._flutter || !window._flutter.loader) {
          throw new Error('Flutter loader is unavailable');
        }

        // Download main.dart.js
        window._flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          }
        }).then(function(engineInitializer) {
          return engineInitializer.initializeEngine();
        }).then(function(appRunner) {
          return appRunner.runApp();
        }).catch(markPlaygroundError);
      } catch (error) {
        markPlaygroundError(error);
      }
    });
  </script>
</body>
</html>
